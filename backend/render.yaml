services:
  - type: web
    name: zoom-clone-backend
    runtime: python
    repo: https://github.com/yourusername/zoom-clone
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LIVEKIT_URL
        value: ws://your-pc-ip:7880  # Your PC's public IP or tunnel URL
      - key: LIVEKIT_API_KEY
        value: devkey
      - key: LIVEKIT_API_SECRET
        value: your-secret-key
      - key: SECRET_KEY
        value: your-super-secret-key
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://your-streamlit-app.streamlit.app,http://localhost:8501
